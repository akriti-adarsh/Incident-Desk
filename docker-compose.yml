services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident_desk
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_desk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.2
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "58025:1025"
      - "58026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://incident:incident@postgres:5432/incident_desk
      SYNC_DATABASE_URL: postgresql+psycopg://incident:incident@postgres:5432/incident_desk
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      JWT_SECRET: dev-only-secret-change-in-production-use-32B+
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      FRONTEND_BASE_URL: "http://localhost:8080"
      SEED_ON_START: "true"
      # The demo stack (and the E2E suite) logs in many times from one host;
      # loosen the per-IP login bucket so that does not throttle. Production
      # keeps the strict default (10/min).
      RATE_LIMIT_LOGIN_PER_MINUTE: "200"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  worker:
    build: ./backend
    entrypoint: ["arq", "incident_desk.jobs.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://incident:incident@postgres:5432/incident_desk
      SYNC_DATABASE_URL: postgresql+psycopg://incident:incident@postgres:5432/incident_desk
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
