server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback: every unknown path serves index.html so client-side
  # routes (deep links to an incident) load correctly.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
