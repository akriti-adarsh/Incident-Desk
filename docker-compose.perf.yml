# Overlay for load testing only: raises the rate limits so the load test
# measures request latency rather than the throttle. Apply with
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml up -d api
# and revert with a plain `docker compose up -d api`.
services:
  api:
    environment:
      RATE_LIMIT_PER_MINUTE: "1000000"
      RATE_LIMIT_LOGIN_PER_MINUTE: "1000000"
